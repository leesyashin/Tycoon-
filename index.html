<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5a7d3a" />
    <link rel="manifest" href="/Tycoon-/manifest.webmanifest" />
    <link rel="icon" href="/Tycoon-/assets/ui/icon.svg" type="image/svg+xml" />
    <title>Matcha Café Empire</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d2a17;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: #f3f7e8;
      }
      #ui > * {
        pointer-events: auto;
      }
      .hud {
        display: inline-block;
        margin: 8px;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 8px;
        pointer-events: none;
        font-size: 14px;
      }
      .hud-hype {
        position: relative;
        margin-top: 4px;
        height: 14px;
        min-width: 140px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 7px;
        overflow: hidden;
        font-size: 10px;
        line-height: 14px;
        text-align: center;
      }
      .hud-hype-fill {
        position: absolute;
        inset: 0 auto 0 0;
        background: #7dc34a;
        transition: width 0.2s;
      }
      .hud-hype.active .hud-hype-fill {
        background: #f5c542;
      }
      .hud-hype span {
        position: relative;
      }
      .hud-hint {
        margin-top: 4px;
        font-size: 10px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
